name: Monthly Instagram Auto Tracker

on:
  schedule:
    # 매월 1일 오전 9시 (KST 기준) 자동 실행 설정
    - cron: '0 0 1 * *'
  workflow_dispatch: # 수동으로도 언제든 깃허브 웹페이지에서 실행 버튼을 누를 수 있는 기능

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: python instagram_apify_crawler.py