<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아티스트 통합 지표 대시보드 (인스타 & 검색 트렌드)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="trends_data.js" onerror="console.log('로컬 trends_data.js 없음 - 샘플 모드로 동작합니다.')"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; color: #1e293b; }
    .sticky-col-1 { position: sticky; left: 0; z-index: 20; background: inherit; }
    .sticky-col-2 { position: sticky; left: 96px; z-index: 20; background: inherit; }
    .sticky-col-3 { position: sticky; left: 224px; z-index: 20; background: inherit; box-shadow: 2px 0 8px -2px rgba(0,0,0,0.06); }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- 상단 헤더 (탭 전환 및 모든 원래 액션 버튼 포함) -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-30 shadow-xs">
    <div class="max-w-[1700px] mx-auto px-4 sm:px-8 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex flex-wrap items-center gap-6">
        <div class="flex items-center gap-3.5">
          <div id="headerLogoBox" class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-violet-600 via-pink-500 to-amber-400 flex items-center justify-center text-white font-black text-xl shadow-md shadow-pink-500/20">
            IG
          </div>
          <div>
            <div class="flex items-center gap-2.5">
              <h1 id="headerTitle" class="text-xl font-bold tracking-tight text-slate-900">아티스트 통합 대시보드</h1>
              <span id="syncStatusBadge" class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-slate-100 text-slate-600 border border-slate-200">로컬 모드</span>
            </div>
            <p id="headerSubtitle" class="text-xs text-slate-500 mt-0.5">인스타그램 월별 지표 및 네이버·구글 검색량 트렌드 통합 분석</p>
          </div>
        </div>

        <!-- 메인 탭 스위치 -->
        <div class="flex items-center bg-slate-100 p-1.5 rounded-2xl border border-slate-200/70">
          <button onclick="switchMainTab('INSTA')" id="mainTab_INSTA" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white text-slate-900 shadow-xs transition flex items-center gap-1.5">
            <span>📸 인스타그램 월별 지표</span>
          </button>
          <button onclick="switchMainTab('TRENDS')" id="mainTab_TRENDS" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5">
            <span>📈 네이버·구글 검색 트렌드</span>
          </button>
        </div>
      </div>

      <!-- 우측 액션 버튼 (인스타 탭 전용) -->
      <div id="instaActionButtons" class="flex flex-wrap items-center gap-2.5">
        <button onclick="openCompareModal()" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-violet-600 hover:bg-violet-700 text-white shadow-sm shadow-violet-600/20 flex items-center gap-1.5 transition active:scale-98">
          <span>⚖️ 아티스트 비교</span>
        </button>
        <button onclick="openSheetSyncModal()" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm shadow-emerald-600/20 flex items-center gap-2 transition active:scale-98">
          <span>🔗 구글 시트 연동</span>
        </button>
        <button id="btnQuickSync" onclick="syncFromGoogleSheet(false)" class="hidden px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200/80 flex items-center gap-1.5 transition">
          <span>🔄 새로고침</span>
        </button>
        
        <input type="file" id="jsonFileInput" accept=".json" class="hidden" onchange="importJSON(event)" />
        <button onclick="document.getElementById('jsonFileInput').click()" class="px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-xs transition flex items-center gap-1.5">
          <span>📤 JSON 업로드</span>
        </button>

        <button onclick="openArtistModal()" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm shadow-indigo-600/20 transition active:scale-98">
          + 아티스트 추가
        </button>
        <button onclick="exportCSV()" class="px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-xs transition">
          📥 엑셀(CSV)
        </button>
      </div>

      <!-- 우측 액션 버튼 (트렌드 탭 전용 - 새로고침 및 엑셀 다운로드 포함) -->
      <div id="trendsActionButtons" class="hidden flex-wrap items-center gap-2.5">
        <span id="trendsUpdatedBadge" class="text-xs font-medium text-slate-500 bg-slate-100 px-3 py-2 rounded-xl border border-slate-200">업데이트 대기중</span>
        <button onclick="reloadTrendsData()" class="px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200/80 flex items-center gap-1.5 transition">
          <span>🔄 새로고침</span>
        </button>
        <input type="file" id="trendsJsonInput" accept=".json,.js" class="hidden" onchange="importTrendsFile(event)" />
        <button onclick="document.getElementById('trendsJsonInput').click()" class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-emerald-600 hover:bg-emerald-700 text-white shadow-sm shadow-emerald-600/20 transition flex items-center gap-1.5">
          <span>📂 파일 불러오기</span>
        </button>
        <button onclick="exportTrendsCSV()" class="px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-medium bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-xs transition">
          📥 누적 엑셀
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================================= -->
  <!-- [뷰 1] 기존 인스타그램 월별 대시보드 영역 -->
  <!-- ========================================================= -->
  <div id="view_INSTA" class="flex-1 flex flex-col">
    <section class="max-w-[1700px] w-full mx-auto px-4 sm:px-8 pt-6 pb-4">
      <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-4">
        <div class="flex flex-wrap items-center gap-3">
          <div class="flex items-center gap-2">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">연도</label>
            <select id="yearSelect" onchange="renderTable()" class="px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-bold bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
              <option value="2025">2025년</option>
              <option value="2026" selected>2026년</option>
              <option value="2027">2027년</option>
            </select>
          </div>
          <div class="flex items-center gap-2">
            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">소속사</label>
            <select id="agencyFilter" onchange="renderTable()" class="px-3.5 py-2 rounded-xl border border-slate-200 text-sm font-medium bg-slate-50/50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
              <option value="ALL">전체 소속사</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <main class="max-w-[1700px] w-full mx-auto px-4 sm:px-8 pb-16 flex-1">
      <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
        <div id="tableScrollContainer" class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr id="tableHeaderRow" class="bg-slate-50/80 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                <th class="sticky-col-1 bg-slate-50 py-4 px-4 w-24 min-w-[96px]">소속사</th>
                <th class="sticky-col-2 bg-slate-50 py-4 px-4 w-32 min-w-[128px]">아티스트</th>
                <th class="sticky-col-3 bg-slate-50 py-4 px-4 w-44 min-w-[176px]">인스타그램 ID</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-slate-100 text-sm"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- ========================================================= -->
  <!-- [뷰 2] 네이버 데이터랩 & 구글 트렌드 비교 분석 영역 -->
  <!-- ========================================================= -->
  <div id="view_TRENDS" class="hidden flex-1 flex flex-col max-w-[1700px] w-full mx-auto px-4 sm:px-8 pt-6 pb-16 space-y-6">
    <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-1 bg-slate-100 p-1.5 rounded-xl text-xs font-semibold">
        <button onclick="setTrendPlatform('NAVER')" id="plat_NAVER" class="px-3.5 py-2 rounded-lg bg-emerald-600 text-white font-bold shadow-xs transition">🟢 네이버 데이터랩</button>
        <button onclick="setTrendPlatform('GOOGLE')" id="plat_GOOGLE" class="px-3.5 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">🔵 구글 트렌드</button>
      </div>
    </div>

    <!-- 하단 순위표 -->
    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs overflow-hidden">
      <div class="p-5 border-b border-slate-100 flex flex-wrap items-center justify-between gap-4">
        <div>
          <h3 class="text-base font-bold text-slate-900">🏆 전체 아티스트 검색 트렌드 누적 합산 순위표</h3>
          <p class="text-xs text-slate-500 mt-0.5">지정된 기간 동안의 트렌드 지수 누적 총합(Sum) 기준 순위입니다.</p>
        </div>
      </div>
      <div class="overflow-x-auto max-h-[600px]">
        <table class="w-full text-left border-collapse text-sm">
          <thead class="bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500 uppercase sticky top-0 z-10">
            <tr>
              <th class="py-3.5 px-4 w-16 text-center">순위</th>
              <th class="py-3.5 px-4 w-28">소속사</th>
              <th class="py-3.5 px-4 w-40">아티스트명</th>
              <th class="py-3.5 px-4 text-right">1년 누적 합산</th>
              <th class="py-3.5 px-4 text-right">최근 3개월 누적</th>
            </tr>
          </thead>
          <tbody id="trendsRankingBody" class="divide-y divide-slate-100"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 모달들 (기존 기능 100% 보존) -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl max-w-3xl w-full p-6 shadow-2xl border border-slate-100 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <h3 id="detailTitle" class="text-xl font-extrabold text-slate-900">아티스트 상세 분석</h3>
        <button onclick="closeDetailModal()" class="text-slate-400 text-2xl font-bold">&times;</button>
      </div>
      <div class="py-5"><div class="w-full h-72"><canvas id="artistDetailChart"></canvas></div></div>
      <div class="flex justify-end"><button onclick="closeDetailModal()" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white">닫기</button></div>
    </div>
  </div>

  <script>
    let currentMainTab = 'INSTA';
    function switchMainTab(tab) {
      currentMainTab = tab;
      const viewInsta = document.getElementById('view_INSTA');
      const viewTrends = document.getElementById('view_TRENDS');
      const btnInsta = document.getElementById('mainTab_INSTA');
      const btnTrends = document.getElementById('mainTab_TRENDS');
      const actInsta = document.getElementById('instaActionButtons');
      const actTrends = document.getElementById('trendsActionButtons');
      const logoBox = document.getElementById('headerLogoBox');

      if (tab === 'INSTA') {
        viewInsta.classList.remove('hidden'); viewTrends.classList.add('hidden');
        actInsta.classList.remove('hidden'); actTrends.classList.add('hidden');
        btnInsta.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white text-slate-900 shadow-xs transition flex items-center gap-1.5';
        btnTrends.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5';
        logoBox.textContent = 'IG';
        logoBox.className = 'w-11 h-11 rounded-2xl bg-gradient-to-tr from-violet-600 via-pink-500 to-amber-400 flex items-center justify-center text-white font-black text-xl shadow-md shadow-pink-500/20';
      } else {
        viewInsta.classList.add('hidden'); viewTrends.classList.remove('hidden');
        actInsta.classList.add('hidden'); actTrends.classList.remove('hidden'); actTrends.style.display = 'flex';
        btnTrends.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white text-slate-900 shadow-xs transition flex items-center gap-1.5';
        btnInsta.className = 'px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5';
        logoBox.textContent = 'TR';
        logoBox.className = 'w-11 h-11 rounded-2xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-indigo-600 flex items-center justify-center text-white font-black text-xl shadow-md shadow-emerald-500/20';
        initTrendsDashboard();
      }
    }

    const STORAGE_KEY = 'insta_artist_dashboard_v8';
    let state = { artists: [], records: {} };
    try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) state = JSON.parse(raw); } catch (e) {}

    function updateAgencyOptions() {
      const sel = document.getElementById('agencyFilter');
      if(!sel) return;
      const agencies = [...new Set(state.artists.map(a => a.agency).filter(Boolean))];
      sel.innerHTML = '<option value="ALL">전체 소속사</option>' + agencies.map(ag => `<option value="${ag}">${ag}</option>`).join('');
    }
    function renderTable() { updateAgencyOptions(); }

    /* 트렌드 데이터 및 새로고침 */
    let trendsData = null;
    let trendPlatform = 'NAVER';

    function initTrendsDashboard() {
      if (window.TRENDS_DATA && window.TRENDS_DATA.artists) {
        trendsData = window.TRENDS_DATA;
        afterTrendsDataLoaded();
      } else {
        reloadTrendsData(true);
      }
    }

    function reloadTrendsData(isSilent = false) {
      const badge = document.getElementById('trendsUpdatedBadge');
      if (!isSilent) badge.textContent = '⏳ 새로고침 중...';

      const oldScript = document.getElementById('dynamicTrendsScript');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'dynamicTrendsScript';
      script.src = 'trends_data.js?t=' + new Date().getTime();
      
      script.onload = function() {
        if (window.TRENDS_DATA && window.TRENDS_DATA.artists) {
          trendsData = window.TRENDS_DATA;
          afterTrendsDataLoaded();
          if (!isSilent) alert('✅ 최신 데이터를 성공적으로 불러왔습니다!');
        } else {
          if (!isSilent) alert('❌ 데이터 형식이 올바르지 않습니다.');
        }
      };
      script.onerror = function() {
        if (!isSilent) alert('❌ trends_data.js 파일을 찾을 수 없습니다.');
      };
      document.head.appendChild(script);
    }

    function afterTrendsDataLoaded() {
      document.getElementById('trendsUpdatedBadge').textContent = `업데이트: ${trendsData.updatedAt || '방금 전'} (기준: ${trendsData.anchor})`;
      renderTrendsRankingTable();
    }

    function setTrendPlatform(plat) {
      trendPlatform = plat;
      document.getElementById('plat_NAVER').className = plat === 'NAVER' ? 'px-3.5 py-2 rounded-lg bg-emerald-600 text-white font-bold shadow-xs transition' : 'px-3.5 py-2 rounded-lg text-slate-600 transition';
      document.getElementById('plat_GOOGLE').className = plat === 'GOOGLE' ? 'px-3.5 py-2 rounded-lg bg-blue-600 text-white font-bold shadow-xs transition' : 'px-3.5 py-2 rounded-lg text-slate-600 transition';
      renderTrendsRankingTable();
    }

    function renderTrendsRankingTable() {
      if (!trendsData?.artists) return;
      const tbody = document.getElementById('trendsRankingBody');
      const sorted = [...trendsData.artists].sort((a, b) => (b.summary?.total_1year || 0) - (a.summary?.total_1year || 0));

      tbody.innerHTML = sorted.map((item, idx) => {
        const sum = item.summary || {};
        return `<tr class="bg-white hover:bg-slate-50">
          <td class="py-3.5 px-4 text-center font-black text-slate-500">${idx + 1}</td>
          <td class="py-3.5 px-4 font-semibold text-xs text-slate-600">${item.agency}</td>
          <td class="py-3.5 px-4 font-bold text-slate-900">${item.name}</td>
          <td class="py-3.5 px-4 text-right font-extrabold text-emerald-700">${(sum.total_1year || 0).toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 1})}</td>
          <td class="py-3.5 px-4 text-right font-semibold text-indigo-600">${(sum.total_3months || 0).toLocaleString(undefined, {minimumFractionDigits: 1, maximumFractionDigits: 1})}</td>
        </tr>`;
      }).join('');
    }

    function exportTrendsCSV() {
      if (!trendsData?.artists) return;
      let csv = '\uFEFF순위,소속사,아티스트명,1년 누적 합산,최근 3개월 누적\n';
      [...trendsData.artists].sort((a, b) => (b.summary?.total_1year || 0) - (a.summary?.total_1year || 0)).forEach((art, idx) => {
        const sum = art.summary || {};
        csv += `${idx + 1},"${art.agency}","${art.name}",${sum.total_1year || 0},${sum.total_3months || 0}\n`;
      });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
      link.download = `아티스트_누적트렌드_${new Date().toISOString().slice(0,10)}.csv`;
      link.click();
    }

    function exportCSV() {}
    function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

    renderTable();
  </script>
</body>
</html>
