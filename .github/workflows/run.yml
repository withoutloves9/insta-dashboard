name: Monthly Instagram Auto Tracker

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: python instagram_apify_crawler.py
